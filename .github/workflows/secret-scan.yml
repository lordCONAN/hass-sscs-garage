# Scan the whole history for committed secrets on every push and pull request.
# Runs the gitleaks binary over all commits (the repo is small), so it also works
# after a force-push, where a "since the last push" range no longer exists.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.24.0

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks

      - name: Scan all commits
        run: ./gitleaks git --redact --verbose --config .gitleaks.toml .
