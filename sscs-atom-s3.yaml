# SSCs garage shutter controller — M5 Atom S3 Lite (ESP32-S3)
#
# Deploy: copy this file and the components/ folder into /config/esphome/ on
# Home Assistant, add the keys from secrets.example.yaml to secrets.yaml there.
#
# The device name and api key match the current install so Home Assistant keeps
# cover.sscs_atom_s3_garage_shutter and does not see a new device.

esphome:
  name: sscs_atom_s3
  comment: SSCs garage shutter BLE controller

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret sscs_api_key

ota:
  - platform: esphome
    password: !secret sscs_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: SSCS Atom S3 Fallback
    password: !secret sscs_fallback_ap_password

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [sscs_garage]

esp32_ble_tracker:

sscs_garage:
  # The shutter is found by its "SSCs" name: the only one nearby is picked
  # automatically, or choose one from Home Assistant (Shutter address below).
  # mac_address: AA:BB:CC:DD:EE:FF   # optional fixed default
  # Optional. 64 hex chars or the QR text from the setup sheet. A key entered in
  # Home Assistant (Shutter key below) is stored on the device and wins over this.
  key: !secret garage_ble_key
  # passcode: -1          # -1 = no passcode (the only verified mode)
  key_input:
    name: Shutter key
  key_status:
    name: Shutter key status
  device_input:
    name: Shutter address
  find_button:
    name: Find shutter
  nearby:
    name: Nearby shutters
  status:
    name: Garage BLE status

# Which real sensor decides open/closed is chosen in Home Assistant: make a
# Template binary sensor helper with this entity ID (see docs/home-assistant.md).
binary_sensor:
  - platform: homeassistant
    id: garage_state_ha
    entity_id: binary_sensor.garage_shutter_state
    internal: true

cover:
  - platform: sscs_garage
    name: Garage Shutter
    travel_time: 30s
    state_sources:
      - name: Home Assistant
        sensor: garage_state_ha
        open_when: "ON"
    default_state_source: Home Assistant
    state_source_select:
      name: Garage state source

# Optional raw command buttons (they bypass the cover's state tracking).
# button:
#   - platform: template
#     name: Garage stop (raw)
#     entity_category: config
#     on_press:
#       - sscs_garage.send:
#           command: stop
